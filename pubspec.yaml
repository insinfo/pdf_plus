name: pdf_plus
description: Pdf creation library for dart
homepage: https://github.com/insinfo/pdf_plus
repository: https://github.com/insinfo/pdf_plus

version: 4.0.3

environment:
  sdk: ^3.6.0

dependencies:
  archive: ">=3.4.0 <4.1.0"
  # image 4.11.0 declares `archive ^4.0.9` but calls `ZLibDecoder.decodeLazy`,
  # which only exists in archive 4.1. With the archive cap above, pub resolves
  # image 4.11.0 + archive 4.0.9 and nothing compiles. Lift this cap together
  # with the archive one.
  image: ">=4.1.0 <4.11.0"
  meta: ">=1.3.0 <2.0.0"
   
dev_dependencies:
  test: ^1.26.3  
  path: ^1.9.1  
